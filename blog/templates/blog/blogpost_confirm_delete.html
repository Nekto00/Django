{% extends 'blog/base.html' %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
    <h1>Удаление записи</h1>

    <div class="blog-post">
        <h2>{{ object.title }}</h2>
        <p>Вы уверены, что хотите удалить эту запись? Это действие нельзя отменить.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'blog:blogpost_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
